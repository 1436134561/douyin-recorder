name: build-setup-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow requests webview pystray bottle
          python -c "import webview; print('webview ok')"

      - name: Download ffmpeg (BtbN essentials)
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          python -c "import zipfile; z=zipfile.ZipFile('ffmpeg.zip'); [z.extract(n,'_ff') for n in z.namelist() if n.endswith('bin/ffmpeg.exe')]"
          cp _ff/*/bin/ffmpeg.exe ffmpeg.exe
          dir ffmpeg.exe

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --noconfirm --distpath dist_v39 --workpath build_v39

      - name: Build NSIS installer
        run: |
          choco install nsis -y --no-progress
          makensis.exe /DVERSION=3.9 douyin_setup.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-recorder-setup
          path: douyin-recorder-setup-*.exe

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: douyin-recorder-setup-*.exe
