name: Build Windows

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        run: pnpm install

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> ../target'

      # 准备捆绑的嵌入式 Python + OpenCV（让检测功能开箱即用）
      - name: Bundle embedded Python + OpenCV
        shell: pwsh
        run: |
          $py = "python-runtime"
          if (!(Test-Path $py)) { New-Item -ItemType Directory -Path $py }
          # 下载嵌入式 Python 3.11 (amd64)
          $url = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile py.zip
          Expand-Archive -Force py.zip -DestinationPath $py
          # 启用 site-packages（嵌入式默认关闭）
          $cfg = Get-ChildItem $py -Filter "python3*._pth" | Select-Object -First 1
          (Get-Content $cfg.FullName) -replace '^#import site', 'import site' | Set-Content $cfg.FullName
          # 安装 pip
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$py/get-pip.py"
          & "$py/python.exe" "$py/get-pip.py" --no-warn-script-location
          # 安装 opencv + numpy
          & "$py/python.exe" -m pip install --no-warn-script-location -r src-tauri/python/requirements.txt
          # 拷贝检测器脚本
          Copy-Item src-tauri/python/detector.py -Destination $py/detector.py -Force

      # 准备捆绑的 ffmpeg（录制/转码必需，开箱即用无需用户另行安装）
      - name: Bundle ffmpeg (Windows)
        shell: pwsh
        run: |
          $ff = "ffmpeg"
          if (!(Test-Path $ff)) { New-Item -ItemType Directory -Path $ff }
          # 下载 ffmpeg（BtbN 主源 + gyan.dev fallback）
          # BtbN/FFmpeg-Builds 走 github.com 下载更稳，且 GPL win64-gpl 含 libx264
          # gyan.dev essentials 作 fallback（曾因偶发不可达导致构建失败）
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "尝试下载 ffmpeg: $url"
              Invoke-WebRequest -Uri $url -OutFile ff.zip -UseBasicParsing -TimeoutSec 300
              if ((Get-Item ff.zip).Length -gt 10MB) { $downloaded = $true; break }
              Write-Host "文件太小，疑似错误页，尝试下一源"
            } catch {
              Write-Host "下载失败: $url -> $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw "所有 ffmpeg 下载源均失败" }
          Expand-Archive -Force ff.zip -DestinationPath ff_tmp
          # 取 bin/ffmpeg.exe 放到 ffmpeg/ffmpeg.exe（与 exe 同级的 resources 捆绑）
          $bin = Get-ChildItem ff_tmp -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $bin.FullName -Destination "$ff/ffmpeg.exe" -Force
          Remove-Item ff.zip, ff_tmp -Recurse -Force

      - name: Build (tauri build -> nsis exe)
        run: pnpm tauri build

      - name: Package Portable (no-install zip)
        # 便携版打包失败不阻塞发布（安装版照常发布；用户可用安装版）
        # 反复失败原因待查（疑似 Cache Rust 恢复的 target 不完整或磁盘空间），
        # 用 continue-on-error 隔离，避免整个 CI 因便携版挂掉
        continue-on-error: true
        shell: pwsh
        run: |
          # 健壮性检查：每个源都验证存在并给出明确的 ::error:: 诊断
          $portable = "portable/douyin-recorder"
          New-Item -ItemType Directory -Path $portable -Force

          $exe = "src-tauri/target/release/douyin-recorder.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "::error::找不到构建产物 $exe。target/release 内容："
            Get-ChildItem src-tauri/target/release -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table
            exit 1
          }
          Copy-Item $exe -Destination "$portable/douyin-recorder.exe" -Force

          if (-not (Test-Path python-runtime)) {
            Write-Error "::error::找不到 python-runtime 目录"
            exit 1
          }
          Copy-Item python-runtime -Destination "$portable/python" -Recurse -Force

          if (-not (Test-Path ffmpeg/ffmpeg.exe)) {
            Write-Error "::error::找不到 ffmpeg/ffmpeg.exe（Bundle ffmpeg 步骤可能未生成）"
            Get-ChildItem ffmpeg -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table
            exit 1
          }
          Copy-Item ffmpeg -Destination "$portable/ffmpeg" -Recurse -Force

          try {
            Compress-Archive -Path "$portable/*" -DestinationPath "douyin-recorder-portable.zip" -Force
          } catch {
            Write-Error "::error::Compress-Archive 失败: $($_.Exception.Message)"
            exit 1
          }
          Remove-Item portable -Recurse -Force
          Write-Host "✅ 便携版打包完成: $(Get-Item douyin-recorder-portable.zip).Length bytes"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-recorder-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable artifact
        if: hashFiles('douyin-recorder-portable.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-recorder-portable
          path: douyin-recorder-portable.zip

      # 发布为 GitHub Release（直接下载 exe，无需登录/解压）
      - name: Publish Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$EXE" douyin-recorder-setup.exe
          # 删除旧 latest 发布与标签，重建为滚动最新版
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          if [ -f douyin-recorder-portable.zip ]; then
            gh release create latest \
              --title "抖音直播录屏 (最新自动构建)" \
              --notes "安装版解压后运行安装程序。便携版解压 douyin-recorder-portable.zip 后直接运行 抖音直播录屏.exe（免安装）。" \
              douyin-recorder-setup.exe \
              douyin-recorder-portable.zip
          else
            gh release create latest \
              --title "抖音直播录屏 (最新自动构建)" \
              --notes "安装版解压后运行安装程序。（便携版本次构建失败，请用安装版）" \
              douyin-recorder-setup.exe
          fi
