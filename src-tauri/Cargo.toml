[package]
name = "douyin-recorder"
version = "0.1.0"
description = "抖音直播录屏 - 类 Olived 的直播录制工具"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "douyin_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# 仅测试时启用 tauri 的 test 模块（mock_builder），不影响发布构建
test = ["tauri/test"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
urlencoding = "2"
regex = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
# 仅在 Windows 下需要；winreg 由 autostart 插件内部处理，这里留空以精简

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
